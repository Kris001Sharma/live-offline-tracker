name: Deploy TS Migrations to Supabase

on:
  push:
    branches:
      - main # Runs whenever code is pushed to your main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Download your repository source code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Set up the official Supabase CLI runner tool
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1

      # 3. Dynamic Extraction Engine: Convert TS migration string to native Postgres SQL
      - name: Extract SQL from TypeScript
        run: |
          mkdir -p supabase/migrations
          
          # This extract utility pulls everything inside your adapter.execute(`...`) wrappers
          sed -n '/adapter.execute(`/,/`)/p' database/migrations/versions/001_initial_schema.ts \
          | sed 's/^[[:space:]]*await adapter.execute(`//g' \
          | sed 's/`);//g' \
          > supabase/migrations/20260726000000_001_initial_schema.sql
          
          # Debug step: Show the clean generated SQL file in the logs
          echo "=== Generated SQL Migration ==="
          cat supabase/migrations/20260726000000_001_initial_schema.sql

      # 4. Link pipeline directly to your live Supabase cloud engine
      - name: Link Supabase Project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

      # 5. Push extracted changes over to your production server
      - name: Push Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push
