name: Deploy TS Migrations to Supabase

on:
  push:
    branches:
      - main # Runs whenever code is pushed to your main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Download your repository source code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Set up the official Supabase CLI runner tool
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1

      # 3. Dynamic Extraction Engine: Clean backticks and format statements with semicolons
      - name: Extract SQL from TypeScript
        run: |
          mkdir -p supabase/migrations
          
          # Isolate only lines inside adapter.execute backticks and strip runtime noise
          sed -n '/adapter.execute(`/,/`)/p' database/migrations/versions/001_initial_schema.ts \
          | sed 's/^[[:space:]]*await adapter.execute(`//g' \
          | sed 's/`);//g' \
          | sed 's/`//g' \
          > temp_raw.sql

          # Append valid PostgreSQL semicolons onto table and index declarations cleanly
          awk '
          {
            print $0;
            if ($0 ~ /^[[:space:]]*\)$/ || $0 ~ /^CREATE INDEX/) {
              print ";";
            }
          }' temp_raw.sql > supabase/migrations/20260726000000_001_initial_schema.sql

          # Debug step: Output file view to guarantee format looks correct in GitHub logs
          echo "=== Formatted SQL Migration ==="
          cat supabase/migrations/20260726000000_001_initial_schema.sql

      # 4. Link pipeline directly to your live Supabase cloud engine
      - name: Link Supabase Project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

      # 5. Push extracted changes automatically to the remote database
      - name: Push Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push
